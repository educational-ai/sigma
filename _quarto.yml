project:
  type: book
  output-dir: _site
  resources:
    - "figures/"

book:
  title: "Учебн🤖к"
  subtitle: "Школьный учебник по информатике (10-11 классы)"
  author: "Альянс ИИ"
  date: today
  date-format: "YYYY-MM-DD"
  chapters:
    - index.qmd
    - converted/preface.qmd
    - part: "I. Введение в искусственный интеллект"
      chapters:
        - converted/ch01_intro.qmd
    - part: "II. Математические основы"
      chapters:
        - converted/ch02_newton.qmd
    - part: "III. Анализ данных и искусственный интеллект"
      chapters:
        - converted/ch03_ds.qmd
    - part: "IV. Дискретная математика и криптография"
      chapters:
        - converted/ch04_numtheory.qmd
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-navigation: true
  reader-mode: true
  twitter-card: true
  open-graph: true

number-depth: 3
toc-depth: 3

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: false
    fig-cap-location: bottom
    css: styles.css
    html-math-method: katex
    grid:
      sidebar-width: 320px
      body-width: 920px
      margin-width: 280px

bibliography: []

execute:
  enabled: false
  freeze: auto
