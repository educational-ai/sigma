  description: "Математика современного ИИ — сюжетами"
  favicon: ../favicon.svg
  back-to-top-navigation: true
  page-navigation: true
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: floating
    collapse-level: 2
    background: "#fffff8"
