project:
  type: website
  output-dir: ../docs
  # Только страницы сайта. Внутренние заметки (INTERACTIVE_REVIEW.md,
  # NARRATIVE_SPINE.md) лежат рядом в book/, и без этого фильтра quarto
  # публиковал их на sigma.fmin.xyz как обычные страницы.
  render:
    - "*.qmd"

lang: ru
language: _language.yml

website:
