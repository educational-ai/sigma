          - ch04_5_heshirovanie-teoriya-chisel-vstr.qmd
          - ch04_6_schetchiki-s-korotkoy-pamyatyu-h.qmd
  page-footer:
    background: "#fffff8"
    left: "Σ Сигма"
    center: |
      [Презентация](/presentation/) · [Бенчмарк ассистента](/benchmark/)
    right: "[GitHub](https://github.com/MerkulovDaniil)"

format:
  html:
    theme: cosmo
    mainfont: "et-book, Palatino, 'Palatino Linotype', Georgia, serif"
    monofont: "JetBrains Mono, SF Mono, Menlo, Consolas, monospace"
    toc: false
    code-fold: false
    code-copy: true
    code-overflow: wrap
    code-block-bg: "#f5f3e8"
    highlight-style: github
    css: [sigma-tufte.css, mobile-safe.css]
    include-after-body: sigma-rename-typst.html
    # Пин версии: по умолчанию Quarto тянет katex@latest с jsdelivr — мажорный
    # апдейт наверху ломает формулы на всём сайте без единого коммита у нас.
    html-math-method:
      method: katex
      # ВАЖНО: слеш в конце обязателен — quarto клеит имя файла встык.
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/"
    number-sections: false
    # Tufte: footnote/citation/figure caption в правую margin-колонку (только HTML)
    reference-location: margin
    citation-location: margin
    fig-cap-location: margin
    grid:
      sidebar-width: 240px
      body-width: 760px
      margin-width: 360px
      gutter-width: 1.6rem
  # Tufte: правая margin шириной 2in для caption/refs, основной текст ~5.5in
  typst:
    output-ext: pdf
    papersize: "us-letter"
    mainfont: "Palatino"
    fontsize: 11pt
    margin:
      left: 1in
      right: 2.0in
      top: 1in
      bottom: 1in
    fig-cap-location: margin
    reference-location: margin
    citation-location: margin

execute:
  enabled: false
  freeze: auto
