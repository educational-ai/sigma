          - ch_linalg_3_singulyarnoe-razlozhenie-svd-gla.qmd
          - ch_linalg_4_luchshee-malorangovoe-priblizhen.qmd
          - ch_linalg_5_eigenfaces-kak-algoritm-uznaet-l.qmd
