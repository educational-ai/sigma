project:
  type: book
  output-dir: ../docs/dop

book:
  title: "Дополнительный учебник"
  subtitle: "Углублённые сюжеты к 10 и 11 классам · текущая Overleaf-сборка"
  author: "Альянс ИИ"
  date: today
  date-format: "YYYY-MM-DD"
  chapters:
    - index.qmd
    - preface.qmd
    - part: "Часть I. Введение в ИИ"
      chapters:
        - ch01_intro.qmd
    - part: "Часть II. Математические основы"
      chapters:
        - ch02_newton.qmd
    - part: "Часть III. Анализ данных и ИИ"
      chapters:
        - ch03_0_intro.qmd
        - ch03_1_prosteyshie-primery-zadach-anali.qmd
        - ch03_2_lineynaya-regressiya-i-metod-nai.qmd
        - ch03_3_zadacha-klassifikacii-i-neyronny.qmd
        - ch03_4_zadachi-obucheniya-bez-uchitelya.qmd
        - ch03_5_kak-iskusstvennyy-intellekt-meny.qmd
    - part: "Часть IV. Дискретная математика и криптография"
      chapters:
        - ch04_0_intro.qmd
        - ch04_1_elementy-teorii-chisel.qmd
        - ch04_2_shifrovanie-ot-taynopisi-k-matem.qmd
        - ch04_3_kriptosistemy-rsa-i-diffi-hellma.qmd
        - ch04_4_primeneniya-rsa-autentifikaciya.qmd
        - ch04_5_heshirovanie-teoriya-chisel-vstr.qmd
        - ch04_6_schetchiki-s-korotkoy-pamyatyu-h.qmd
        - ch04_7_podvedenie-itogov-glavy.qmd
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  page-navigation: true
  reader-mode: true

number-sections: false
number-depth: 3
toc-depth: 3

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    highlight-style: github
    fig-cap-location: bottom
    css: ../styles.css
    html-math-method: katex
    number-sections: false
    grid:
      sidebar-width: 320px
      body-width: 920px
      margin-width: 280px

execute:
  enabled: false
  freeze: auto
